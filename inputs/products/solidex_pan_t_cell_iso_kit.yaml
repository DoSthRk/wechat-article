  - GM-CD8-T-Cell-iso-kit：人CD8+ T细胞分选试剂盒（柱式，Untouched）
  - GM-Tg-hg-T87075-iso-nanoIMB：人CD3分选纳米磁珠（柱式）
use_cases:
- Glofitamab 等 CD20×CD3 双特异性抗体的 T 细胞依赖性杀伤机制研究
- 淋巴瘤细胞与人源 T 细胞共培养实验
- T 细胞活化、耗竭、细胞因子释放和免疫表型分析
- 临床样本或 PBMC 中 T 细胞群体的前处理
target_users:
- 血液肿瘤研究团队
- 肿瘤免疫实验室
- 双特异性抗体和细胞治疗研发团队
- 医学院和科研院所免疫学课题组
forbidden_claims:
- 不要宣称产品可用于临床诊断或临床治疗。
- 不要暗示产品可直接改善 Glofitamab 疗效或患者预后。
- 不要承诺适用于所有样本类型或所有实验体系。
- 不要使用“最佳”“第一”“唯一”等绝对化表述。
closing_hint: 结尾落到“T 细胞功能 / 双特异性抗体体外机制研究中，高质量、未被激活的 Pan-T 细胞是实验起点”的现实需求，顺势提及本产品（Untouched 阴性分选）适合这类上游样本制备；保持中立、不承诺临床用途、不暗示改善疗效。
