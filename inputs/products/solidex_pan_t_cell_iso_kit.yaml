name: SOLIDEX®-ISOEx 人CD3+ Pan-T细胞分选试剂盒（柱式，Untouched）
one_liner: 面向 T 细胞相关免疫学、肿瘤免疫和双特异性抗体研究的人 CD3+ Pan-T 细胞负向分选试剂盒。
selling_points:
- 采用 Untouched 阴性选择思路，尽量避免直接标记或激活目标 T 细胞。
- 适用于需要保留 T 细胞天然状态的体外功能实验、共培养实验和免疫机制研究。
- 可用于双特异性抗体、CAR-T 前研究、T 细胞介导杀伤和细胞因子释放相关实验的上游样本准备。
- 柱式分选流程清晰，适合标准化处理 PBMC 或相关人源样本中的 CD3+ Pan-T 细胞。
specs:
  产品货号: GM-Pan-T-Cell-iso-kit
  产品系列: SOLIDEX®-ISOEx
  产品名称: 人CD3+ Pan-T细胞分选试剂盒（柱式，Untouched）
  分选方式: 阴性选择
  适配场景: T 细胞功能研究、肿瘤免疫研究、双特异性抗体体外机制验证
  相关产品:
