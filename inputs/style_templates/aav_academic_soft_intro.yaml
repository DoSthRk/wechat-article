  - https://mp.weixin.qq.com/s/nGDaHlNF5d8HnL0PLHgiOg
  raw_instruction: 参考这两家公司发布的微信公众号文章的内容和篇幅，帮我解析下面的这篇文章，需要挑文章里3-4附图插入，最后再推荐我们的AAV快速纯化离心柱
    ， 要求是用高维度的学术内容，降维打击市场，名为科普，实为带货（PurProX AAV纯化离心柱），但要做到“润物细无声”。去乙方化。看起来像是一个中立的AAV工艺智库或学术社区，而不是GeneMedi的产品宣传册。
  image_count: 3-4
