User tinyproxy
Group tinyproxy
Port 18888
Listen 127.0.0.1
Timeout 120
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Notice
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 20
Allow 127.0.0.1
Allow ::1
ViaProxyName "gm-wechat-egress"
DisableViaHeader Yes
Filter "/etc/tinyproxy/wechat-filter"
FilterURLs Off
FilterType ere
FilterCaseSensitive No
FilterDefaultDeny Yes
ConnectPort 443
