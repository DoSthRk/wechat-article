<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容发布流水线</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header class="app-header">
    <div><p class="eyebrow">GM-LAB / 内容平台</p><h1>内容发布流水线</h1></div>
    <div class="header-actions"><div class="stats" id="stats" aria-live="polite"></div><a class="gm-lab-home" href="https://lab.genemedi.cn/">返回 GM-LAB</a></div>
  </header>
  <main class="workspace">
    <section class="stage-bar" aria-label="内容流程状态">
      <div class="stage"><span class="stage-number">1</span><div><strong>PDF 待处理</strong><span id="stage-pdf">加载中</span></div></div><div class="stage-line"></div>
      <div class="stage"><span class="stage-number">2</span><div><strong>公众号草稿</strong><span id="stage-wechat">加载中</span></div></div><div class="stage-line"></div>
      <div class="stage"><span class="stage-number">3</span><div><strong>CMS 发布</strong><span id="stage-cms">加载中</span></div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><p class="section-kicker">发布队列</p><h2>文章状态</h2></div><button id="refresh-pipeline" class="btn ghost">刷新</button></div>
      <div class="pipeline-toolbar"><span id="pipeline-selection" class="muted">未选择文章</span><div class="toolbar-actions"><button id="blog-translate" class="btn ghost">翻译选中英文</button><button id="blog-publish" class="btn primary">发布选中版本</button></div></div>
      <div id="pipeline-message" class="pipeline-message" aria-live="polite"></div>
      <div class="table-wrap"><table class="pipeline-table"><thead><tr><th class="check-col"><input id="pick-all" type="checkbox" aria-label="选择可操作文章"></th><th>文章</th><th>生成</th><th>公众号草稿</th><th>CMS 中文</th><th>英文</th><th>操作</th></tr></thead><tbody id="pipeline-rows"><tr><td colspan="7" class="muted empty-cell">加载中</td></tr></tbody></table></div>
    </section>
    <section class="panel source-panel">
      <div class="panel-head"><div><p class="section-kicker">PDF 输入</p><h2>待处理文件</h2></div><button id="refresh-src" class="btn ghost">刷新</button></div>
      <div id="sources"><p class="muted source-loading">加载中</p></div>
    </section>
    <section class="panel run-panel">
      <div class="panel-head"><div><p class="section-kicker">任务记录</p><h2>运行状态</h2></div><div class="run-actions"><span id="run-badge" class="run-badge idle">空闲</span><button id="cancel-run" class="btn danger" disabled>停止任务</button></div></div>
      <div id="run-current" class="run-current"></div><details class="run-details" open><summary>当前任务日志</summary><pre id="run-log" class="run-log muted">暂无运行任务</pre></details><div id="run-history" class="run-history"></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
