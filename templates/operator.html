<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ line_label }} 内容工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='operator.css') }}">
</head>
<body data-line-id="{{ line_id }}">
  <header class="page-header">
    <div>
      <p class="eyebrow">GM-LAB / 内容平台</p>
      <h1>{{ line_label }} 内容工作台</h1>
      <p class="identity">当前用户：{{ username }} · 仅显示你负责的业务线</p>
    </div>
    <div class="header-actions">
      <button id="refresh" class="btn secondary">刷新</button>
      {% if direct_mode %}
      <a class="gm-lab-home" href="{{ url_for('select_line') }}">切换业务线</a>
      {% else %}
      <a class="gm-lab-home" href="https://lab.genemedi.cn/">返回 GM-LAB</a>
      {% endif %}
    </div>
  </header>

  <main>
    <section class="workflow-guide" aria-label="标准工作流程">
      <div class="guide-copy">
        <span class="guide-kicker">标准流程</span>
        <h2>首次确认配图，后续自动多语言发布</h2>
        <p>生成中文文章与图片候选 → 人工确认配图 → 中文 Blog / 公众号草稿 → 自动多语言发布</p>
      </div>
      <div class="guide-steps" aria-hidden="true">
        <span><b>1</b>上传生成</span><i>›</i><span><b>2</b>确认配图</span><i>›</i><span><b>3</b>自动发布</span>
      </div>
    </section>

    <section id="lines" class="lines"></section>
  </main>
  <script src="{{ url_for('static', filename='operator.js') }}"></script>
</body>
</html>
