version: 1
slug: article
name: AAV 与 Solidex 内容
description: GeneMedi 公众号文章生成、审核与投放面板
runtime: python
build_command: python3.11 -m venv .venv && .venv/bin/pip install -r requirements.txt
start_command: ".venv/bin/gunicorn --workers 2 --bind 127.0.0.1:${PORT} --access-logfile - --error-logfile - 'app:create_app()'"
health_path: /api/health
required_env:
  - DEEPSEEK_API_KEY
  - WECHAT_IMMUNE_APP_ID
  - WECHAT_IMMUNE_APP_SECRET
  - WECHAT_AAV_APP_ID
  - WECHAT_AAV_APP_SECRET
